services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: ai_tutorial_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_tutorial_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutorial_rag}
      # POSTGRES_USER/PASSWORD bootstrap the superuser (see .env for where
      # these come from — never hardcoded). docker/postgres/init/002-create-app-user.sh
      # uses POSTGRES_APP_USER/PASSWORD to create the least-privilege role
      # the application actually connects with.
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB:-ai_tutorial_rag}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
